<script>
'use strict';
// ===================== きほん =====================
const W=360,H=640;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let SC=1,DPR=1;
function fit(){DPR=Math.min(window.devicePixelRatio||1,3);SC=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*SC+'px';cv.style.height=H*SC+'px';cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);}
addEventListener('resize',fit);fit();
const now=()=>performance.now();
const FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
function font(px){g.font='bold '+px+'px '+FONT}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ===================== いろ =====================
function rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));const A=rgb(a),B=rgb(b);return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')'}
function mixh(a,b,t){t=Math.max(0,Math.min(1,t));const A=rgb(a),B=rgb(b);return '#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('')}
let TINT=0;
function C(h){if(h[0]!=='#')return h;return TINT>0.01?mix(h,'#8ec8ff',TINT*0.65):h}

// ===================== かたち =====================
function circ(x,y,r,c){g.fillStyle=C(c);g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function ell(x,y,rx,ry,c,rot){g.fillStyle=C(c);g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill()}
function ellO(x,y,rx,ry,c,oc,rot){g.fillStyle=C(c);g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();g.strokeStyle=C(oc);g.lineWidth=0.9;g.stroke()}
function circO(x,y,r,c,oc){ellO(x,y,r,r,c,oc)}
function poly(p,c){g.fillStyle=C(c);g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rrf(x,y,w,h,r,c){g.fillStyle=C(c);rrp(x,y,w,h,r);g.fill()}
function heart(x,y,s,c){g.fillStyle=C(c);g.beginPath();g.moveTo(x,y+s*0.9);g.bezierCurveTo(x-s*1.25,y+s*0.05,x-s*0.9,y-s*0.95,x,y-s*0.3);g.bezierCurveTo(x+s*0.9,y-s*0.95,x+s*1.25,y+s*0.05,x,y+s*0.9);g.fill()}
function star(x,y,r,c,rot){g.fillStyle=C(c);g.beginPath();for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5;const rr=i%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}
function text(t,x,y,px,col,align,stroke){font(px);g.textAlign=align||'center';g.textBaseline='middle';if(stroke){g.lineJoin='round';g.strokeStyle=stroke;g.lineWidth=Math.max(3,px/5);g.strokeText(t,x,y)}g.fillStyle=col;g.fillText(t,x,y)}
function wrap(t,mw){const lines=[];t.split('\n').forEach(p=>{let line='';p.split(' ').forEach(w=>{if(!w)return;const test=line?line+' '+w:w;if(g.measureText(test).width<=mw){line=test}else if(!line){let cur='';for(const ch of w){if(g.measureText(cur+ch).width>mw){lines.push(cur);cur=ch}else cur+=ch}line=cur}else{lines.push(line);line=w}});lines.push(line)});return lines}
function ent(fn,x,y,s,o,flip){g.save();g.translate(x,y);g.scale(flip?-s:s,s);fn(o||{});g.restore()}

// ===================== かお =====================
function eyes(x,y,dx,mood,s,col){g.lineCap='round';
 for(const sx of [-1,1]){const ex=x+sx*dx;
  if(mood==='happy'){g.strokeStyle=C(col);g.lineWidth=1.5*s;g.beginPath();g.arc(ex,y+1*s,2.4*s,Math.PI*1.15,Math.PI*1.85);g.stroke()}
  else{ell(ex,y,2.2*s,3*s,col);circ(ex+0.7*s,y-1.1*s,0.85*s,'#ffffff')}
  if(mood==='angry'||mood==='sad'){const ix=ex-sx*2.8*s,ox=ex+sx*2.8*s;const iy=y-(mood==='angry'?3.8:6.2)*s,oy=y-(mood==='angry'?6.2:4.2)*s;g.strokeStyle=C('#3a2a3a');g.lineWidth=1.3*s;g.beginPath();g.moveTo(ix,iy);g.lineTo(ox,oy);g.stroke()}
 }}
function mouth(x,y,mood,s){g.strokeStyle=C('#8a3a4a');g.lineWidth=1.3*s;g.lineCap='round';g.beginPath();
 if(mood==='happy'){g.arc(x,y-1*s,2.6*s,0.15*Math.PI,0.85*Math.PI)}
 else if(mood==='angry'||mood==='sad'){g.arc(x,y+2*s,2*s,1.2*Math.PI,1.8*Math.PI)}
 else{g.arc(x,y-0.5*s,1.6*s,0.2*Math.PI,0.8*Math.PI)}
 g.stroke()}

 mouth(0,-32.5,mood,1);

 if(hen)star(-9,-52,4,'#ffe04a');
}

 poly([-10,-30,-11,-42,-3,-36],c);poly([10,-30,11,-42,3,-36],c);poly([-9,-33,-9.5,-39,-5,-35.5],'#ffb8c8');poly([9,-33,9.5,-39,5,-35.5],'#ffb8c8');

 eyes(0,-28,4.6,m,0.9,'#3c7a4a');poly([-1.3,-24.5,1.3,-24.5,0,-23],'#ff8fa8');mouth(0,-22,m,0.8);
 g.strokeStyle=C('#c8b090');g.lineWidth=0.6;g.beginPath();g.moveTo(-6,-24);g.lineTo(-13,-25);g.moveTo(-6,-23);g.lineTo(-13,-22);g.moveTo(6,-24);g.lineTo(13,-25);g.moveTo(6,-23);g.lineTo(13,-22);g.stroke();

 if(L.cane){g.strokeStyle=C('#8a5a3a');g.lineWidth=2;g.beginPath();g.moveTo(14,-15);g.lineTo(16,0);g.stroke()}

function bfs(goal){const sx=Math.round(P.x),sy=Math.round(P.y);const key=(x,y)=>y*9+x;const prev=new Map();prev.set(key(sx,sy),-1);const q=[[sx,sy]];
 while(q.length){const [x,y]=q.shift();if(goal(x,y)){const path=[];let k=key(x,y);while(k!==key(sx,sy)){path.unshift({x:k%9,y:Math.floor(k/9)});k=prev.get(k)}return path}
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=9||ny>=14)continue;if(!prev.has(key(nx,ny))&&walk(nx,ny)){prev.set(key(nx,ny),key(x,y));q.push([nx,ny])}}}
 return null}

 let ok=true;ns.forEach(n=>{try{localStorage.setItem(SKOF(+n),JSON.stringify(r[n]))}catch(e){ok=false}});

function update(dt,t){
 for(const f of snow){f.y+=f.v*dt;f.x+=Math.sin(t/900+f.d)*12*dt;if(f.y>H){f.y=-5;f.x=Math.random()*W}}
 if(mode==='map'){
  for(const id of Object.keys(MAPS))dispWarm[id]+=(warmOf(id)-dispWarm[id])*Math.min(1,dt*1.5);
  if(P.path.length&&!UI.msg&&!menuMode){const tg=P.path[0];const dx=tg.x-P.x,dy=tg.y-P.y,dist=Math.hypot(dx,dy);const step=4.6*dt;P.walk+=dt;if(Math.abs(dx)>0.01)P.dir=dx>0?1:-1;
   if(dist<=step){P.x=tg.x;P.y=tg.y;P.path.shift();P.penT={x:P.last.x,y:P.last.y};P.last={x:tg.x,y:tg.y};
    const h=hiddenAt(tg.x,tg.y);if(h)pickHidden(h);
    const ch=tileAt(tg.x,tg.y);
    const ex=EXITS[S.map]&&EXITS[S.map][ch];if(ex){P.path=[];changeMap(ex[0],ex[1],ex[2]);return}
    if(!P.path.length)run(arrive)}
   else{P.x+=dx/dist*step;P.y+=dy/dist*step}}
  const pdx=P.penT.x-P.pen.x,pdy=P.penT.y-P.pen.y,pd=Math.hypot(pdx,pdy);if(pd>0.01){const st=Math.min(pd,5*dt);P.pen.x+=pdx/pd*st;P.pen.y+=pdy/pd*st}
 }
 if(mode==='battle'&&B){B.disp+=(B.ice-B.disp)*Math.min(1,dt*6);
  const G=B.guard;if(G&&!G.done&&(t-G.at)/G.dur>1.12){G.done=true;G.endAt=t;G.endP=1.12;G.ok=false;G.res(false)}
  for(const p of B.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt}B.parts=B.parts.filter(p=>t-p.at<p.life);B.pops=B.pops.filter(p=>t-p.at<1000)}
}

  if(bagTab==='fuku'){Object.keys(FUKU).forEach((k,i)=>{const x=14+(i%5)*67,y=334+Math.floor(i/5)*124;rrf(x,y,63,118,14,S.fuku===k?'#fff0d8':'#ffffff');if(S.fuku===k){g.strokeStyle='#ffa83a';g.lineWidth=3;rrp(x,y,63,118,14);g.stroke()}
   ent(drawYupi,x+31,y+88,1.0,{hen:0,mood:'happy',t,fuku:k});text(FUKU[k].name,x+31,y+105,11,'#6a5a7a')})}
  else Object.keys(DRESS).forEach((k,i)=>{const x=14+(i%5)*67,y=330+Math.floor(i/5)*128;const has=S.dresses[k];rrf(x,y,63,122,14,S.dress===k?'#ffe0ee':'#ffffff');if(S.dress===k){g.strokeStyle='#ff6fa8';g.lineWidth=3;rrp(x,y,63,122,14);g.stroke()}
   if(has)ent(drawYupi,x+31,y+86,1.0,{hen:1,mood:'happy',t,dress:k});else text('？',x+31,y+52,28,'#d8d0e0');
   const nm=has?DRESS[k].name:(DRESS[k].gift?'？？？':'おみせで かえる');font(9);const ls=wrap(nm,58).slice(0,2);ls.forEach((l,j)=>text(l,x+31,y+(ls.length>1?102:108)+j*12,9,'#6a5a7a'))})}
 else if(menuMode==='arena')drawArena(t);
 else if(menuMode==='zukan'){const n=ZUKAN.filter(z=>S.friends[z]).length;text(n+' / '+ZUKAN.length+' にん',336,71,14,'#8a7a9a','right');
  const pages=Math.ceil(ZUKAN.length/6);if(zPage>=pages)zPage=0;
  if(pages>1){rrf(ZPREV[0],ZPREV[1],ZPREV[2],ZPREV[3],22,zPage>0?'#ff9cc6':'#e8e0ea');text('◀',ZPREV[0]+ZPREV[2]/2,ZPREV[1]+22,18,'#ffffff');rrf(ZNEXT[0],ZNEXT[1],ZNEXT[2],ZNEXT[3],22,zPage<pages-1?'#ff9cc6':'#e8e0ea');text('▶',ZNEXT[0]+ZNEXT[2]/2,ZNEXT[1]+22,18,'#ffffff')}
  ZUKAN.slice(zPage*6,zPage*6+6).forEach((id,i)=>{const x=14+(i%2)*170,y=92+Math.floor(i/2)*162;const d=EN[id];const has=S.friends[id];rrf(x,y,162,154,14,'#ffffff');
   if(has){ent(d.draw,x+81,y+96,d.zs,{mood:'happy',t});text(d.name,x+81,y+112,12,'#4a3a5a');font(10);wrap(d.zukan,146).slice(0,2).forEach((l,j)=>text(l,x+81,y+128+j*13,10,'#8a7a9a'))}
   else{TINT=0;g.globalAlpha=0.25;ent(d.draw,x+81,y+96,d.zs,{mood:'normal',t});g.globalAlpha=1;text('？？？',x+81,y+120,16,'#c8c0d8')}})}
 if(menuMode!=='bag'||true){rrf(CLOSE_BOT[0],CLOSE_BOT[1],CLOSE_BOT[2],CLOSE_BOT[3],22,'#b8b0c8');text('とじる',180,CLOSE_BOT[1]+22,17,'#ffffff')}
}
function drawUI(t){
 if(UI.msg){const m=UI.msg;const y0=474;rrf(8,y0,344,158,18,'#ffffff');g.strokeStyle='#ffb3d1';g.lineWidth=3;rrp(8,y0,344,158,18);g.stroke();
  if(m.who){font(14);const w=g.measureText(m.who).width;const col=m.who==='ペンちゃん'?'#5aa8e8':m.who==='ユーピー'?'#2fbf98':'#9a7ac8';rrf(18,y0-14,w+24,28,14,col);text(m.who,30+w/2,y0,14,'#ffffff')}
  font(17);wrap(m.t,312).slice(0,5).forEach((l,i)=>text(l,24,y0+30+i*27,17,'#4a3a5a','left'));
  if(Math.floor(t/400)%2)poly([330,y0+138,342,y0+138,336,y0+146],'#ff8fc0')}
 if(UI.choices){const rs=choiceRects();const big=UI.layout==='battle';
  UI.choices.forEach((o,i)=>{const r=rs[i];if(big&&i===0&&!S.talkOk){const gl=0.5+Math.sin(t/180)*0.5;g.globalAlpha=gl;rrf(r[0]-5,r[1]-5,r[2]+10,r[3]+10,20,'#ffe066');g.globalAlpha=1}rrf(r[0],r[1],r[2],r[3],big?16:14,o.col||'#ff8fc0');if(big&&i===0&&!S.talkOk){star(r[0]+r[2]-14,r[1]+12,7,'#ffe066',t/300);star(r[0]+14,r[1]+r[3]-12,5,'#ffffff',-t/300)}rrf(r[0],r[1]+r[3]-5,r[2],5,3,'rgba(0,0,0,.08)');
   font(big?(i===4?16:20):16);let s=o.t;while(g.measureText(s).width>r[2]-16&&s.length>2)s=s.slice(0,-1);text(s,r[0]+r[2]/2,r[1]+r[3]/2,big?(i===4?16:20):16,'#ffffff')})}
 if(UI.banner){const b=UI.banner;const e=(t-b.at)/b.dur;if(e<1){g.globalAlpha=e<0.15?e/0.15:e>0.8?(1-e)/0.2:1;font(b.px);const w=Math.min(340,g.measureText(b.t).width+36);rrf(180-w/2,250-b.px,w,b.px*2,b.px,'rgba(255,255,255,.95)');text(b.t,180,250,b.px,'#ff4f97');g.globalAlpha=1}else UI.banner=null}
}
function render(t){g.setTransform(SC*DPR,0,0,SC*DPR,0,0);g.clearRect(0,0,W,H);
 if(mode==='title')drawTitle(t);
 else if(mode==='story')drawStory(t);
 else if(mode==='map')drawMap(t);
 else if(mode==='battle'&&B)drawBattle(t);
 else if(mode==='endcard')drawEnd(t);
 else if(mode==='slots')drawSlots(t);
 if(menuMode)drawMenu(t);
 drawUI(t)}
let last=now();
function frame(){const t=now();const dt=Math.min(0.05,(t-last)/1000);last=t;try{update(dt,t);render(t)}catch(e){console.error(e)}requestAnimationFrame(frame)}
hasSave=!!load(1);
if(location.hash)run(moveCheck);addEventListener('hashchange',()=>{if(location.hash&&!busy&&(mode==='title'||mode==='slots'))run(moveCheck)});
requestAnimationFrame(frame);
window.__yupi={get S(){return S},get B(){return B},get mode(){return mode},get P(){return P},onTap,get UI(){return UI},get Q(){return Q},tick(n){for(let i=0;i<n;i++)update(0.05,now())}};
</script>
